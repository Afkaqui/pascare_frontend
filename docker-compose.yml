services:
  pascare-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Horneado en el bundle en build. Debe apuntar al API público (con /api).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.pascare.tech/api}
    container_name: pascare-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
    ports:
      - "3060:3000"
